<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>访问观察 · VeloRoam</title><link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.14/lib/theme-chalk/index.css"><style>
[v-cloak]{display:none}body{margin:0;background:#f3f6f3;color:#20332a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1400px;margin:auto;padding:32px 24px 70px}.brand{color:#548267;font-size:12px;letter-spacing:.14em;font-weight:700}header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}h1{margin:8px 0 4px;font-size:32px}p,.muted{color:#77877d;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card,.panel{background:#fff;border:1px solid #e3ebe3;border-radius:14px;padding:20px}.card span{display:block;color:#728377;font-size:13px}.card strong{display:block;font-size:28px;margin-top:8px}.panel{margin-top:18px}.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.filters .el-input{width:145px}.filters .el-select{width:130px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}.cell-sub{color:#819088;font-size:12px;line-height:1.4;margin-top:4px}.table-wrap{overflow:auto}.pagination{display:flex;justify-content:end;margin-top:20px}.detail{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8f6;padding:16px;border-radius:8px;font-size:12px}.el-button--primary{background:#286344;border-color:#286344}@media(max-width:700px){main{padding:24px 14px}.cards{grid-template-columns:repeat(2,1fr)}.panel{padding:14px}.filters .el-input{width:100%}.filters .el-date-editor{max-width:100%}}
</style></head><body><main id="app" v-cloak><header><div><div class="brand">VELOROAM / OBSERVER</div><h1>访问观察</h1><p>了解访问、定位与路线规划记录</p></div><el-button @click="load" icon="el-icon-refresh">刷新</el-button></header>
<section class="cards"><div class="card"><span>符合条件的记录</span><strong>{{summary.total || 0}}</strong></div><div class="card"><span>访问</span><strong>{{summary.visits || 0}}</strong></div><div class="card"><span>定位</span><strong>{{summary.locations || 0}}</strong></div><div class="card"><span>路线规划</span><strong>{{summary.routes || 0}}</strong></div></section>
<section class="panel"><div class="bar"><div><strong>记录一览</strong><p>汇总和导出均使用当前筛选条件</p></div><el-button type="primary" icon="el-icon-download" :loading="exporting" @click="exportCsv">导出时间段数据</el-button></div><div class="filters"><el-date-picker v-model="filters.range" type="datetimerange" value-format="yyyy-MM-dd HH:mm:ss" range-separator="至" start-placeholder="开始时间" end-placeholder="结束时间" :default-time="['00:00:00','23:59:59']"></el-date-picker><el-input v-model="filters.id" placeholder="序号" clearable></el-input><el-select v-model="filters.type" placeholder="类型" clearable><el-option label="访问" value="visit"></el-option><el-option label="定位" value="location"></el-option><el-option label="路线规划" value="route"></el-option></el-select><el-input v-model="filters.ip" placeholder="IP 地址" clearable></el-input><el-input v-model="filters.coordinates" placeholder="坐标关键词" clearable></el-input><el-button type="primary" @click="search">检索</el-button><el-button @click="reset">重置</el-button></div></section>
<section class="panel table-wrap"><el-table :data="rows" v-loading="loading" @row-click="show" style="width:100%;cursor:pointer" empty-text="没有符合条件的记录"><el-table-column prop="id" label="序号" width="90"></el-table-column><el-table-column label="时间" min-width="160"><template slot-scope="s">{{formatTime(s.row.created_at)}}</template></el-table-column><el-table-column label="类型" width="110"><template slot-scope="s"><el-tag size="small" effect="plain">{{labels[s.row.event_type] || s.row.event_type}}</el-tag></template></el-table-column><el-table-column label="IP 地址 / 归属地" min-width="190"><template slot-scope="s"><div>{{dataOf(s.row).clientIp || '未记录'}}</div><div class="cell-sub">{{place(s.row, 'ip')}}</div></template></el-table-column><el-table-column label="位置坐标 / 地址" min-width="260"><template slot-scope="s"><div>{{coords(s.row)}}</div><div class="cell-sub">{{place(s.row, 'coordinate')}}</div></template></el-table-column><el-table-column label="操作" width="80"><template slot-scope="s"><el-button type="text" @click.stop="show(s.row)">详情</el-button></template></el-table-column></el-table><div class="pagination"><el-pagination background layout="total, prev, pager, next, sizes" :total="Number(summary.total)||0" :page-size="size" :page-sizes="[20,50,100]" :current-page="page" @current-change="changePage" @size-change="changeSize"></el-pagination></div></section>
<el-dialog title="记录详情" :visible.sync="dialog" width="min(680px, 90%)"><p>位置归属地为高德估算，定位地址根据设备坐标解析。</p><pre class="detail">{{detail}}</pre></el-dialog></main>
<script src="https://unpkg.com/vue@2.7.16/dist/vue.min.js"></script><script src="https://unpkg.com/element-ui@2.15.14/lib/index.js"></script><script>
new Vue({el:'#app',data(){return{filters:{range:null,id:'',type:'',ip:'',coordinates:''},applied:{},page:1,size:20,rows:[],summary:{},loading:false,exporting:false,dialog:false,detail:'',cache:{},pending:{},labels:{visit:'访问',location:'定位',route:'路线规划'}}},mounted(){this.load()},methods:{
params(page,size){const q=new URLSearchParams();for(const [k,v] of Object.entries(this.applied))if(v)q.set(k,v);q.set('page',page);q.set('size',size);return q},
async request(page,size){const r=await fetch('/api/observer/events?'+this.params(page,size),{cache:'no-store'});if(!r.ok)throw Error('读取失败（'+r.status+'）');return r.json()},
async load(){this.loading=true;try{const r=await this.request(this.page,this.size);this.rows=r.events;this.summary=r.summary||{};this.rows.forEach(row=>{this.resolve(row,'ip');this.resolve(row,'coordinate')})}catch(e){this.$message.error(e.message)}finally{this.loading=false}},
search(){const f=this.filters;this.applied={start:f.range&&f.range[0],end:f.range&&f.range[1],id:f.id,type:f.type,ip:f.ip,coordinates:f.coordinates};this.page=1;this.load()},reset(){this.filters={range:null,id:'',type:'',ip:'',coordinates:''};this.search()},changePage(n){this.page=n;this.load()},changeSize(n){this.size=n;this.page=1;this.load()},
dataOf(row){if(typeof row.data==='object'&&row.data)return row.data;try{return JSON.parse(row.data)||{}}catch(e){return{}}},coords(row){const d=this.dataOf(row);return d.latitude!=null&&d.longitude!=null?d.latitude+', '+d.longitude:'未记录'},formatTime(v){const d=new Date(v);return isNaN(d)?v:d.toLocaleString('zh-CN',{hour12:false})},key(row,kind){const d=this.dataOf(row);return kind==='ip'?(d.clientIp?'ip:'+d.clientIp:''):(d.latitude!=null&&d.longitude!=null?'coord:'+d.latitude+','+d.longitude:'')},place(row,kind){const k=this.key(row,kind);return !k?'未记录':(this.cache[k]||'解析中…')},
async resolve(row,kind){const d=this.dataOf(row),k=this.key(row,kind);if(!k||this.pending[k]||this.cache[k])return;this.$set(this.pending,k,true);const q=new URLSearchParams(kind==='ip'?{ip:d.clientIp}:{lat:d.latitude,lng:d.longitude});try{const r=await fetch('/api/observer/geocode?'+q,{cache:'no-store'});if(!r.ok)throw Error();const result=await r.json();this.$set(this.cache,k,result.address||'无法解析')}catch(e){this.$set(this.cache,k,'无法解析')}finally{this.$delete(this.pending,k)}},show(row){this.detail=JSON.stringify(row,null,2);this.dialog=true},
async exportCsv(){if(!this.applied.start||!this.applied.end){this.$message.warning('请先选择时间段并点击检索');return}this.exporting=true;try{let page=1,all=[],result;do{result=await this.request(page++,500);all.push(...result.events)}while(all.length<Number(result.summary.total)&&result.events.length);const quote=v=>'"'+String(v==null?'':v).replace(/^[\s]*[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';const lines=[['序号','时间','类型','IP 地址','纬度','经度','会话','详细数据'].map(quote).join(',')];for(const row of all){const d=this.dataOf(row);lines.push([row.id,this.formatTime(row.created_at),this.labels[row.event_type]||row.event_type,d.clientIp,d.latitude,d.longitude,row.session_id,JSON.stringify(d)].map(quote).join(','))}const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='veloroam-observer.csv';a.click();URL.revokeObjectURL(url);this.$message.success('已导出 '+all.length+' 条记录')}catch(e){this.$message.error('导出失败：'+e.message)}finally{this.exporting=false}}
}});
</script></body></html>
