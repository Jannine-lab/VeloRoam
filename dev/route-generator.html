<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VeloRoam · 路线生成调试</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#172d29;background:#f2f6f3}*{box-sizing:border-box}body{margin:0}header{height:66px;padding:0 22px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid #dfe8e2}header strong{font-size:17px}header span{font-size:12px;color:#668078;border-left:1px solid #dce6df;padding-left:12px}.layout{height:calc(100vh - 66px);display:grid;grid-template-columns:350px 1fr}.panel{padding:20px;overflow:auto;background:#fff;border-right:1px solid #dfe8e2}h1{font-size:20px;margin:0 0 6px}p{line-height:1.55;color:#637770;font-size:13px}label{display:block;font-size:12px;font-weight:600;margin:18px 0 6px;color:#426059}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}input{width:100%;border:1px solid #d7e4dc;border-radius:9px;padding:10px;color:#173c30;background:#fafcfb}button{border:1px solid #d5e3db;border-radius:9px;padding:10px;background:#fff;color:#305f4d;cursor:pointer;font-weight:600}button.active{background:#e4f5e9;border-color:#75bd8c;color:#17613d}button.primary{width:100%;background:#196b48;color:white;border:0;margin-top:18px}button:disabled{opacity:.5;cursor:wait}#map{height:100%;width:100%}.hint{font-size:12px;padding:10px;border-radius:9px;background:#f1f7f3;color:#527566;line-height:1.5;margin-top:14px}#status{font-size:13px;color:#45685b;margin:18px 0 10px;line-height:1.5}.candidate{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;font-weight:400}.candidate b{display:block;font-size:13px}.candidate small{display:block;color:#6b8077;margin-top:5px;line-height:1.4}.candidate.chosen{border-color:#239162;background:#effaf3}.legend{font-size:12px;color:#647c70;display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.footer{font-size:11px;color:#8da097;margin-top:20px;line-height:1.5}@media(max-width:720px){.layout{height:auto;display:flex;flex-direction:column-reverse}.panel{height:50vh}#map{height:44vh}header{height:60px}}
</style>
</head>
<body><header><strong>VeloRoam</strong><span>路线生成调试</span></header><main class="layout"><section class="panel"><h1>自主选点与路线</h1><p>在地图上设置起点和可选的目标方向，查看生成的关键点与真实导航结果。</p><div class="row"><button id="startMode" class="active">设置起点</button><button id="focusMode">设置目标方向</button></div><div class="hint" id="hint">点击地图设置起点；切换按钮后可设置目标方向。</div><label for="start">起点 · 纬度, 经度（WGS84）</label><input id="start" value="31.200000, 121.400000"><label for="focus">目标方向 · 纬度, 经度（可选）</label><div class="row"><input id="focus" placeholder="留空则从起点附近生成"><button id="clearFocus" style="flex:0 0 auto">清除</button></div><label for="segmentId">指定 Strava 路段 ID（可选）</label><input id="segmentId" inputmode="numeric" placeholder="留空则自主生成全部途经点"><div class="hint">指定路段或点位后，当前优先按指定对象规划；目标方向暂不参与联合规划。</div><label for="pointId">指定点位 ID（可选）</label><input id="pointId" inputmode="numeric" placeholder="输入数据库中的活跃点位 ID"><label for="pointOrder">路段和点位的顺序</label><select id="pointOrder" style="width:100%;border:1px solid #d7e4dc;border-radius:9px;padding:10px;background:#fafcfb"><option value="after">先骑路段，再去点位</option><option value="before">先去点位，再骑路段</option></select><label for="distance">目标里程 · 公里</label><input id="distance" type="number" min="5" max="200" value="30"><button id="generate" class="primary">生成候选路线</button><div class="legend"><span><i class="dot" style="background:#166b47"></i>已选路线</span><span><i class="dot" style="background:#6588af"></i>其他候选</span><span><i class="dot" style="background:#e89535"></i>生成的途经点</span><span><i class="dot" style="background:#a655bb"></i>指定路段</span></div><label style="display:flex;align-items:center;gap:8px;font-weight:400"><input id="showSeeds" type="checkbox" style="width:auto"> 显示轨迹采样候选和选择原因</label><div id="status" role="status">设置参数后开始生成。</div><div id="results"></div><div class="footer">重复比例基于 30 米网格粗略估算，平行道路可能被算作重复。仅本机调试使用。空心橙点是搜索目标，蓝点是轨迹采样候选，实心橙点是选中位置；实际通行情况仍需现场确认。</div></section><div id="map" aria-label="路线调试地图"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const $ = id => document.getElementById(id);
const map=L.map('map').setView([31.2,121.4],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const base=L.layerGroup().addTo(map), routes=L.layerGroup().addTo(map);let mode='start',data=null,selected=null;
function point(value){const parts=value.split(',').map(Number);return parts.length===2&&parts.every(Number.isFinite)&&Math.abs(parts[0])<=85&&Math.abs(parts[1])<=180?{lat:parts[0],lng:parts[1]}:null}
function circle(p,color,label){return L.circleMarker([p.lat,p.lng],{radius:7,color:'#fff',weight:2,fillColor:color,fillOpacity:1}).bindTooltip(label).addTo(base)}
function renderBase(){base.clearLayers();const a=point($('start').value),b=point($('focus').value);if(a)circle(a,'#155e40','起点');if(b)circle(b,'#b159a1','目标方向')}
function chooseMode(value){mode=value;$('startMode').classList.toggle('active',mode==='start');$('focusMode').classList.toggle('active',mode==='focus');$('hint').textContent=mode==='start'?'点击地图设置起点。':'点击地图设置目标方向；可以留空。'}
$('startMode').onclick=()=>chooseMode('start');$('focusMode').onclick=()=>chooseMode('focus');$('clearFocus').onclick=()=>{$('focus').value='';renderBase()};['start','focus'].forEach(id=>$(id).addEventListener('change',renderBase));
map.on('click',e=>{$(mode).value=`${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;renderBase()});renderBase();
$('showSeeds').onchange=()=>draw();
function draw(){routes.clearLayers();$('results').replaceChildren();if(!data)return;const all=[];for(const a of data.attempts){const chosen=a.id===selected;const color=chosen?'#166b47':'#6588af';if(a.route){for(const leg of a.route.legs){const points=leg.points.map(p=>[p.lat,p.lng]);if(points.length){const line=L.polyline(points,{color:chosen&&leg.type==='segment'?'#a655bb':color,weight:chosen?5:3,opacity:chosen ? .95 : .38}).addTo(routes);line.on('click',()=>{selected=a.id;draw()});if(chosen)all.push(...points)}}}if(chosen&&$('showSeeds').checked)for(const w of [...(a.waypoints||[]),...(a.samplingFailures||[])]){if(w.seedPath?.length)L.polyline(w.seedPath.map(p=>[p.lat,p.lng]),{color:'#2783c4',weight:3,opacity:.65,dashArray:'5 7',interactive:false}).addTo(routes);L.circleMarker([w.proposed.lat,w.proposed.lng],{radius:6,color:'#de9136',weight:2,fillOpacity:0}).bindTooltip('搜索目标（未经导航确认）').addTo(routes);for(const sample of (w.samples||[])){const marker=L.circleMarker([sample.point.lat,sample.point.lng],{radius:sample.status==='selected'?5:4,color:sample.status==='rejected'?'#aab3ac':'#2783c4',weight:2,fillColor:sample.status==='selected'?'#e89535':'#fff',fillOpacity:1});marker.bindTooltip(`轨迹 ${Math.round(sample.fraction*100)}% · ${sample.reason}`).addTo(routes)}if(w.selected)L.polyline([[w.proposed.lat,w.proposed.lng],[w.selected.lat,w.selected.lng]],{color:'#de9136',weight:2,dashArray:'3 4',interactive:false}).addTo(routes)}if(chosen)for(const [i,s] of a.stops.entries()){const p=s.coordinates[0],w=(a.waypoints||[]).find(x=>x.selected.lat===p.lat&&x.selected.lng===p.lng);L.circleMarker([p.lat,p.lng],{radius:6,color:'#fff',weight:2,fillColor:w?'#e89535':s.type==='segment'?'#a655bb':'#9daaa2',fillOpacity:1}).bindTooltip(`${i+1}. ${s.name}${w?` · 导航轨迹选点，偏移 ${Math.round(w.offsetMeters)} 米`:s.type==='segment'?' · 指定路段入口':' · 未确认搜索目标'}`).addTo(routes)}const btn=document.createElement('button');btn.className='candidate'+(chosen?' chosen':'');const title=document.createElement('b');title.textContent=`${a.id} · ${a.status==='accepted'?'符合预算':a.status==='unreachable'?'不可达':a.status==='unchanged'?'无不同点位':'不符合预算'}${data.selected?.id===a.id?' · 推荐':''}`;const detail=document.createElement('small');detail.textContent=(a.route?`${a.route.distanceKm.toFixed(1)} km · ${Math.round(a.route.durationMin)} 分钟 · ${a.reason} · ${a.overlap ? `估算重复 ${(a.overlap.fraction*100).toFixed(0)}%` : '重复比例未知'}`:a.reason)+` · 已从导航轨迹选取 ${(a.waypoints||[]).length} 个点`;if(a.change)detail.textContent+=` · 基于 ${a.change.baselineId} 仅调整 ${a.change.waypoint}（${Math.round(a.change.fromFraction*100)}% → ${Math.round(a.change.toFraction*100)}%）`;if(a.route?.continuity)detail.textContent+=` · 端点与拼接处或途经点最大间隔约 ${Math.ceil(a.route.continuity.maxGapMeters)} 米（不代表已验证通行）`;if(a.comparison)detail.textContent+=` · ${a.comparison}`;btn.append(title,detail);btn.onclick=()=>{selected=a.id;draw()};$('results').append(btn);if(chosen)for(const w of [...(a.waypoints||[]),...(a.samplingFailures||[])]){const details=document.createElement('details');details.style.cssText='font-size:12px;color:#547267;margin:8px 4px';const summary=document.createElement('summary');summary.textContent=`${w.name} · 轨迹采样 ${w.samples?.length||0} 个`;details.append(summary);for(const sample of (w.samples||[])){const line=document.createElement('div');line.style.cssText='padding:4px 2px;line-height:1.4';line.textContent=`${Math.round(sample.fraction*100)}% · ${sample.status==='selected'?'已选':sample.status==='rejected'?'排除':'备选'} · ${sample.reason}`;details.append(line)}$('results').append(details)}}if(all.length)map.fitBounds(all,{padding:[35,35]})}
$('generate').onclick=async()=>{const start=point($('start').value),focus=$('focus').value.trim()?point($('focus').value):null,targetKm=Number($('distance').value),segmentId=$('segmentId').value.trim(),pointId=$('pointId').value.trim(),pointOrder=$('pointOrder').value;if((pointId&&!/^[1-9][0-9]{0,19}$/.test(pointId))||(segmentId&&!/^[1-9][0-9]{0,19}$/.test(segmentId))||!start||($('focus').value.trim()&&!focus)||!Number.isFinite(targetKm)||targetKm<5||targetKm>200){$('status').textContent='请检查坐标和目标里程（5～200 公里）。';return}$('generate').disabled=true;$('status').textContent='正在生成候选并调用骑行导航，可能需要几十秒……';$('results').replaceChildren();routes.clearLayers();try{const response=await fetch('/api/routes/debug/route-generator',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({start,focus,targetKm,segmentId:segmentId||null,pointId:pointId||null,pointOrder})});const result=await response.json();if(!response.ok)throw new Error(result.error||'请求失败');data=result;selected=result.selected?.id||result.attempts[0]?.id;$('status').textContent=`已尝试 ${result.attempts.length} 条候选；预算 ${(result.bounds.minKm).toFixed(1)}～${(result.bounds.maxKm).toFixed(1)} 公里。${result.selected?'已选出可用路线。':'暂无符合预算的候选。'} ${result.selectionReason||''}${result.requiredOrder?.length?` 指定顺序：${result.requiredOrder.map(x=>x.name).join(' → ')}。`:''} 路况、风景和道路安全信息未知。`;draw()}catch(error){$('status').textContent=`生成失败：${error.message}`}finally{$('generate').disabled=false}};
</script></body></html>
